name: Atualizar Catálogo IPTV

on:
  schedule:
    # Executa diariamente às 08:00 e às 20:00 (Horário de Brasília: 11:00 e 23:00 UTC)
    - cron: '0 11,23 * * *'
  # Permite que você clique em "Run workflow" no GitHub a qualquer momento para atualizar na hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Consultar Servidor IPTV e Atualizar Catálogo
        run: python update.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iptv_dados.json data.js
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada no catálogo."
          else
            git commit -m "chore: atualizar catálogo IPTV [skip ci]"
            git push
          fi
